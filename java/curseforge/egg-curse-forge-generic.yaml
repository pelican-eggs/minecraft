scripts:
  installation:
    script: |-
      #!/bin/bash
      # shellcheck disable=SC2155
      #
      # CurseForge Installation Script
      #
      # Server Files: /mnt/server

      : "${SERVER_DIR:=/mnt/server}"
      : "${PROJECT_ID:=}"
      : "${VERSION_ID:=}"
      : "${API_KEY:=}"

      if [[ ! -d $SERVER_DIR ]]; then
          mkdir -p "$SERVER_DIR"
      fi

      if ! cd "$SERVER_DIR"; then
          echo -e "Failed to change directory to ${SERVER_DIR}"
          exit 1
      fi

      function install_required {
          echo -e "Installing required packages..."
          echo -e "\tRunning apt update"
          apt update > /dev/null 2>&1 || { echo "apt update failed!"; exit 1; }
          echo -e "\tRunning apt install"
          apt install -y wget jq unzip > /dev/null 2>&1 || { echo "apt install failed!"; exit 1; }
      }

      CURSEFORGE_API_URL="https://api.curseforge.com/v1/mods/"
      CURSEFORGE_API_HEADERS=("--header=Accept: application/json" "--header=x-api-key: ${API_KEY}")
      CURSEFORGE_CDN_HEADERS=("--header=x-api-key: ${API_KEY}")

      function cf_resolve_download_url {
          local pid=$1 fid=$2 project_data=${3:-} response url="" headers status
          headers=$(mktemp) || return 1
          if response=$(wget -q --server-response --timeout=30 --tries=3 "${CURSEFORGE_API_HEADERS[@]}" "${CURSEFORGE_API_URL}${pid}/files/${fid}/download-url" -O - 2>"${headers}"); then
              url=$(printf '%s' "${response}" | jq -er '.data | select(type == "string" and test("^https?://"))' 2>/dev/null) || url=""
          fi
          status=$(awk '/^[[:space:]]*HTTP\// { code = $2 } END { print code }' "${headers}")
          rm -f "${headers}"

          if [[ -n "${url}" ]]; then
              printf '%s\n' "${url}"
              return 0
          fi

          if [[ -z "${project_data}" ]]; then
              project_data=$(wget -q --timeout=30 --tries=3 "${CURSEFORGE_API_HEADERS[@]}" "${CURSEFORGE_API_URL}${pid}" -O -)
          fi
          if printf '%s' "${project_data}" | jq -e '.data.allowModDistribution == false' >/dev/null 2>&1; then
              echo "ERROR: Project ${pid} has disabled third-party distribution through the CurseForge API." >&2
              echo "       Its files must be downloaded manually from CurseForge." >&2
          else
              echo "ERROR: Could not retrieve a download URL for project ${pid}, file ${fid} (HTTP ${status:-unavailable})." >&2
          fi
          return 1
      }
      function get_download {
          echo -e "Retrieving CurseForge project information..."
          local PROJECT_DATA=$(wget -q "${CURSEFORGE_API_HEADERS[@]}" "${CURSEFORGE_API_URL}${PROJECT_ID}" -O -)
          local PROJECT_TITLE=$(echo "$PROJECT_DATA" | jq -r '.data.name // empty')

          if [[ -z "${PROJECT_DATA}" ]]; then
              echo -e "\tERROR: Failed to retrieve project data for project id '${PROJECT_ID}'"
              exit 1
          fi

          local IS_SERVER_PACK=false

          if [[ -z "${VERSION_ID}" || "${VERSION_ID}" == "latest" ]]; then
              echo -e "\tNo file ID specified, using latest file"
              VERSION_ID=$(echo "$PROJECT_DATA" | jq -r '.data.mainFileId // empty')

              local VERSION_SERVER_PACK="$(echo -e "${PROJECT_DATA}" | jq -r --arg VERSION_ID "$VERSION_ID" '.data.latestFiles[] | select(.id|tostring==$VERSION_ID) | .isServerPack')"
              local VERSION_SERVER_ID="$(echo -e "${PROJECT_DATA}" | jq -r --arg VERSION_ID "$VERSION_ID" '.data.latestFiles[] | select(.id|tostring==$VERSION_ID) | .serverPackFileId | select(. != null and . != 0)')"

              if [[ "${VERSION_SERVER_PACK}" == "false" && -n "${VERSION_SERVER_ID}" ]]; then
                  echo -e "\tFound server pack file id '${VERSION_SERVER_ID}'"
                  VERSION_ID=$VERSION_SERVER_ID
                  IS_SERVER_PACK=true
              elif [[ "${VERSION_SERVER_PACK}" == "true" ]]; then
                  IS_SERVER_PACK=true
              fi
          else
              echo -e "\tChecking if provided file id '${VERSION_ID}' exists"

              local FILE_DATA=$(wget -q "${CURSEFORGE_API_HEADERS[@]}" "${CURSEFORGE_API_URL}${PROJECT_ID}/files/${VERSION_ID}" -O -)

              if [[ -z "${FILE_DATA}" ]]; then
                  echo -e "\tERROR: File id '${VERSION_ID}' not found for project '${PROJECT_TITLE}'"
                  exit 1
              fi

              IS_SERVER_PACK=$(echo -e "${FILE_DATA}" | jq -r '.data.isServerPack // "false"')

              if [[ "${IS_SERVER_PACK}" == "false" ]]; then
                  local VERSION_SERVER_PACK="$(echo -e "${FILE_DATA}" | jq -r '.data.serverPackFileId | select(. != null and . != 0)')"
                  if [[ -n "${VERSION_SERVER_PACK}" ]]; then
                      echo -e "\tFound server pack file id '${VERSION_SERVER_PACK}'"
                      VERSION_ID=$VERSION_SERVER_PACK
                      IS_SERVER_PACK=true
                  fi
              else
                  IS_SERVER_PACK=true
              fi
          fi

          # Check if version id is unset or empty string
          if [[ -z "${VERSION_ID}" ]]; then
              echo -e "\tERROR: No file id found for project '${PROJECT_TITLE}'"
              exit 1
          fi

          if [[ "${IS_SERVER_PACK}" == "false" ]]; then
              echo -e "\tWARNING: File id '${VERSION_ID}' is not a server pack, attempting to use client files"
          fi

          # get json data to work with
          echo -e "\tRetrieving version information for '${VERSION_ID}'"
          local DOWNLOAD_URL
          if ! DOWNLOAD_URL=$(cf_resolve_download_url "${PROJECT_ID}" "${VERSION_ID}" "${PROJECT_DATA}"); then
              exit 1
          fi

          # download modpack files
          echo -e "\tDownloading ${DOWNLOAD_URL}"
          if ! wget -q "${CURSEFORGE_CDN_HEADERS[@]}" "${DOWNLOAD_URL}" -O server.zip; then
              echo -e "Download failed!"
              exit 1
          fi
      }

      function parse_loader_manifest {
          local MANIFEST="$1"
          echo -e "\tParsing loader manifest"

          if ! LOADER_ID=$(jq -er '[.minecraft.modLoaders[]? | select(.primary == true) | .id] | select(length == 1) | .[0] | select(type == "string")' "${MANIFEST}") || [[ ! "${LOADER_ID}" =~ ^[a-z]+-[[:alnum:]][[:alnum:].+_-]*$ ]]; then
              echo -e "\tERROR: Expected one primary loader with a valid name and version in manifest!"
              exit 1
          fi
          LOADER_NAME=${LOADER_ID%%-*}
          LOADER_VERSION=${LOADER_ID#*-}

          case "${LOADER_NAME}" in
              forge|fabric|neoforge|quilt) ;;
              *)
                  echo "ERROR: Unsupported loader '${LOADER_NAME}' in manifest"
                  exit 1
                  ;;
          esac

          MINECRAFT_VERSION=$(jq -r '.minecraft.version // empty' "${MANIFEST}")

          if [[ -z "${MINECRAFT_VERSION}" ]]; then
              echo -e "\tERROR: No minecraft version found in manifest!"
              exit 1
          fi

          echo -e "\tFound loader ${LOADER_NAME} ${LOADER_VERSION} for Minecraft ${MINECRAFT_VERSION}"
      }
      function get_loader {
          echo -e "Retrieving loader information..."

          local PROJECT_DATA=$(wget -q "${CURSEFORGE_API_HEADERS[@]}" "${CURSEFORGE_API_URL}${PROJECT_ID}" -O -)
          local PROJECT_TITLE=$(echo "$PROJECT_DATA" | jq -r '.data.name // empty')
          if [[ -z "${PROJECT_DATA}" ]]; then
              echo -e "\tERROR: Failed to retrieve project data for project id '${PROJECT_ID}'"
              exit 1
          fi

          local FILE_DATA=$(wget -q "${CURSEFORGE_API_HEADERS[@]}" "${CURSEFORGE_API_URL}${PROJECT_ID}/files/${VERSION_ID}" -O -)

          if [[ -z "${FILE_DATA}" ]]; then
              echo -e "\tERROR: File id '${VERSION_ID}' not found for project '${PROJECT_TITLE}'"
              exit 1
          fi

          local IS_SERVER_PACK=$(echo -e "${FILE_DATA}" | jq -r '.data.isServerPack // "false"')
          local CLIENT_VERSION_ID;

          if [[ "${IS_SERVER_PACK}" == "true" ]]; then
              CLIENT_VERSION_ID="$(echo -e "${FILE_DATA}" | jq -r '.data.parentProjectFileId // empty')"
          else
              CLIENT_VERSION_ID=$VERSION_ID
          fi

          if [[ -z "${CLIENT_VERSION_ID}" ]]; then
              echo -e "\tERROR: File id '${VERSION_ID}' not found for project '${PROJECT_TITLE}'"
              exit 1
          fi

          echo -e "\tRetrieving file information for '${CLIENT_VERSION_ID}'"
          local DOWNLOAD_URL
          if ! DOWNLOAD_URL=$(cf_resolve_download_url "${PROJECT_ID}" "${CLIENT_VERSION_ID}" "${PROJECT_DATA}"); then
              exit 1
          fi

          # download modpack files
          echo -e "\tDownloading ${DOWNLOAD_URL}"
          if ! wget -q "${CURSEFORGE_CDN_HEADERS[@]}" "${DOWNLOAD_URL}" -O client.zip; then
              echo -e "\tERROR: Client manifest download failed!"
              exit 1
          fi

          echo -e "\tUnpacking client manifest"
          if ! unzip -p client.zip manifest.json > "${SERVER_DIR}/client.manifest.json" 2>/dev/null || [[ ! -s "${SERVER_DIR}/client.manifest.json" ]]; then
              echo "ERROR: Could not extract a nonempty manifest.json from the downloaded client archive."
              echo "This egg requires a CurseForge manifest to determine the mod loader."
              echo "If the archive only contains an FTB installer, use the FTB egg instead."
              exit 1
          fi
          rm -f client.zip

          parse_loader_manifest "${SERVER_DIR}/client.manifest.json"
      }

      function unzip-strip() (
          set -u

          local archive=$1
          local destdir=${2:-}
          shift; shift || :
          echo -e "\tUnpacking ${archive} to ${destdir}"

          echo -e "\tCreating temporary directory"
          local tmpdir=/mnt/server/tmp
          if ! mkdir -p "${tmpdir}"; then
              echo -e "\tERROR: mkdir failed to create temporary directory"
              return 1
          fi

          trap 'rm -rf -- "$tmpdir"' EXIT

          echo -e "\tUnpacking archive"

          if ! unzip -q "$archive" -d "$tmpdir"; then
              echo -e "\tERROR: unzip failed to unpack archive"
              return 1
          fi

          echo -e "\tSetting glob settings"

          shopt -s dotglob

          echo -e "\tCleaning up directory structure"

          local files=("$tmpdir"/*) name i=1

          if (( ${#files[@]} == 1 )) && [[ -d "${files[0]}" ]]; then
              name=$(basename "${files[0]}")
              files=("$tmpdir"/*/*)
          else
              name=$(basename "$archive"); name=${archive%.*}
              files=("$tmpdir"/*)
          fi

          if [[ -z "$destdir" ]]; then
              destdir=./"$name"
          fi

          while [[ -f "$destdir" ]]; do
              destdir=${destdir}-$((i++));
          done

          echo -e "\tCopying files to ${destdir}"

          mkdir -p "$destdir"
          if ! cp -ar "$@" -t "$destdir" -- "${files[@]}"; then
              echo -e "\tERROR: Failed to copy unpacked files"
              return 1
          fi
          rm -rf "$tmpdir"
      )

      function unpack_zip {
          echo -e "Unpacking server files..."
          if ! unzip-strip server.zip "${SERVER_DIR}"; then
              echo -e "\tERROR: Failed to unpack server.zip"
              exit 1
          fi
          rm -rf server.zip
      }

      function json_download_mods() (
          set -o pipefail
          echo "Downloading mods..."

          local MANIFEST="${SERVER_DIR}/manifest.json"
          jq -c '.files[]? | select(.required == true) | {project: .projectID, file: .fileID}' "${MANIFEST}" | while read -r mod; do
              local MOD_PROJECT_ID=$(echo "${mod}" | jq -r '.project // empty')
              local MOD_FILE_ID=$(echo "${mod}" | jq -r '.file // empty')

              if [[ -z "${MOD_PROJECT_ID}" || -z "${MOD_FILE_ID}" ]]; then
                  echo -e "\tERROR: Failed to parse project id or file id for mod '${mod}'"
                  exit 1
              fi

              local FILE_URL
              if ! FILE_URL=$(cf_resolve_download_url "${MOD_PROJECT_ID}" "${MOD_FILE_ID}"); then
                  echo
                  echo "ERROR: Required mod ${MOD_PROJECT_ID} (file ${MOD_FILE_ID}) cannot be downloaded."
                  echo "       Automatic installation is incomplete."
                  echo
                  exit 1
              fi

              echo -e "\tDownloading ${FILE_URL}"

              if ! wget -q -nc "${CURSEFORGE_CDN_HEADERS[@]}" "${FILE_URL}" -P "${SERVER_DIR}/mods"; then
                  echo -e "\tERROR: Failed to download mod ${MOD_PROJECT_ID} ${MOD_FILE_ID}"
                  exit 1
              fi
          done
      )

      function json_download_overrides {
          echo "Copying overrides..."
          local OVERRIDES SERVER_ROOT SOURCE_DIR
          if ! OVERRIDES=$(jq -er '.overrides // "overrides" | select(type == "string")' "${SERVER_DIR}/manifest.json"); then
              echo "ERROR: Invalid overrides directory in manifest"
              return 1
          fi
          [[ -z "${OVERRIDES}" ]] && return 0

          SERVER_ROOT=$(realpath -e -- "${SERVER_DIR}") || return 1
          SOURCE_DIR=$(realpath -m -- "${SERVER_ROOT}/${OVERRIDES}") || return 1
          if [[ "${OVERRIDES}" == /* || "/${OVERRIDES}/" == */../* || "${SOURCE_DIR}" != "${SERVER_ROOT}/"* ]]; then
              echo "ERROR: Overrides must be a directory within the server directory"
              return 1
          fi
          if [[ ! -e "${SOURCE_DIR}" ]]; then
              return 0
          fi
          if [[ ! -d "${SOURCE_DIR}" ]]; then
              echo "ERROR: Overrides path is not a directory"
              return 1
          fi
          if ! cp -a -- "${SOURCE_DIR}/." "${SERVER_ROOT}/"; then
              echo "ERROR: Failed to copy overrides; the source directory has been kept"
              return 1
          fi
          rm -r -- "${SOURCE_DIR}"
      }

      FORGE_INSTALLER_URL="https://maven.minecraftforge.net/net/minecraftforge/forge/"

      function json_download_forge {
          echo "Downloading Forge..."

          local MC_VERSION=$MINECRAFT_VERSION
          local FORGE_VERSION=$LOADER_VERSION

          FORGE_VERSION="${MC_VERSION}-${FORGE_VERSION}"
          if [[ "${MC_VERSION}" == "1.7.10" || "${MC_VERSION}" == "1.8.9" ]]; then
              FORGE_VERSION="${FORGE_VERSION}-${MC_VERSION}"
          fi

          local FORGE_JAR="forge-${FORGE_VERSION}.jar"
          if [[ "${MC_VERSION}" == "1.7.10" ]]; then
              FORGE_JAR="forge-${FORGE_VERSION}-universal.jar"
          fi

          local FORGE_URL="${FORGE_INSTALLER_URL}${FORGE_VERSION}/forge-${FORGE_VERSION}"

          echo -e "\tUsing Forge ${FORGE_VERSION} from ${FORGE_URL}"

          local FORGE_INSTALLER="${FORGE_URL}-installer.jar"
          echo -e "\tDownloading Forge Installer ${FORGE_VERSION} from ${FORGE_INSTALLER}"

          if ! wget -q -O forge-installer.jar "${FORGE_INSTALLER}"; then
              echo -e "\tERROR: Failed to download Forge Installer ${FORGE_VERSION}"
              exit 1
          fi

          # Remove old Forge files so we can safely update
          rm -rf libraries/net/minecraftforge/forge/
          rm -f unix_args.txt

          echo -e "\tInstalling Forge Server ${FORGE_VERSION}"
          if ! java -jar forge-installer.jar --installServer > /dev/null 2>&1; then
              echo -e "\tERROR: Failed to install Forge Server ${FORGE_VERSION}"
              exit 1
          fi

          if [[ $MC_VERSION =~ ^1\.(17|18|19|20|21|22|23) || $FORGE_VERSION =~ ^1\.(17|18|19|20|21|22|23) ]]; then
              echo -e "\tDetected Forge 1.17 or newer version. Setting up Forge Unix arguments"
              ln -sf libraries/net/minecraftforge/forge/*/unix_args.txt unix_args.txt
          else
              mv "$FORGE_JAR" forge-server-launch.jar
              echo "forge-server-launch.jar" > ".serverjar"
          fi

          rm -f forge-installer.jar
      }

      FABRIC_INSTALLER_URL="https://meta.fabricmc.net/v2/versions/installer"

      function json_download_fabric {
          echo "Downloading Fabric..."

          local MC_VERSION=$MINECRAFT_VERSION
          local FABRIC_VERSION=$LOADER_VERSION

          local INSTALLER_JSON=$(wget -q -O - ${FABRIC_INSTALLER_URL} )
          local INSTALLER_VERSION=$(echo "$INSTALLER_JSON" | jq -r '.[0].version // empty')
          local INSTALLER_URL=$(echo "$INSTALLER_JSON" | jq -r '.[0].url // empty')

          if [[ -z "${INSTALLER_VERSION}" ]]; then
              echo -e "\tERROR: No Fabric installer version found"
              exit 1
          fi

          if [[ -z "${INSTALLER_URL}" ]]; then
              echo -e "\tERROR: No Fabric installer url found"
              exit 1
          fi

          echo -e "\tDownloading Fabric Installer ${MC_VERSION}-${FABRIC_VERSION} (${INSTALLER_VERSION}) from ${INSTALLER_URL}"

          if ! wget -q -O fabric-installer.jar "${INSTALLER_URL}"; then
              echo -e "\tERROR: Failed to download Fabric Installer ${MC_VERSION}-${FABRIC_VERSION} (${INSTALLER_VERSION})"
              exit 1
          fi

          echo -e "\tInstalling Fabric Server ${MC_VERSION}-${FABRIC_VERSION} (${INSTALLER_VERSION})"
          if ! java -jar fabric-installer.jar server -mcversion "${MC_VERSION}" -loader "${FABRIC_VERSION}" -downloadMinecraft; then
              echo -e "\tERROR: Failed to install Fabric Server ${MC_VERSION}-${FABRIC_VERSION} (${INSTALLER_VERSION})"
              exit 1
          fi

          echo "fabric-server-launch.jar" > ".serverjar"

          rm -f fabric-installer.jar
      }

      QUILT_INSTALLER_URL="https://meta.quiltmc.org/v3/versions/installer"

      function json_download_quilt {
          echo "Downloading Quilt..."

          local MC_VERSION=$MINECRAFT_VERSION
          local QUILT_VERSION=$LOADER_VERSION

          local INSTALLER_JSON=$(wget -q -O - ${QUILT_INSTALLER_URL} )
          local INSTALLER_VERSION=$(echo "$INSTALLER_JSON" | jq -r '.[0].version // empty')
          local INSTALLER_URL=$(echo "$INSTALLER_JSON" | jq -r '.[0].url // empty')

          if [[ -z "${INSTALLER_VERSION}" ]]; then
              echo -e "\tERROR: No Quilt installer version found"
              exit 1
          fi

          if [[ -z "${INSTALLER_URL}" ]]; then
              echo -e "\tERROR: No Quilt installer URL found"
              exit 1
          fi

          echo -e "\tDownloading Quilt Installer ${MC_VERSION}-${QUILT_VERSION} (${INSTALLER_VERSION}) from ${INSTALLER_URL}"

          if ! wget -q -O quilt-installer.jar "${INSTALLER_URL}"; then
              echo -e "\tERROR: Failed to download Quilt Installer ${MC_VERSION}-${QUILT_VERSION} (${INSTALLER_VERSION})"
              exit 1
          fi

          echo -e "\tInstalling Quilt Server ${MC_VERSION}-${QUILT_VERSION} (${INSTALLER_VERSION})"
          if ! java -jar quilt-installer.jar install server "${MC_VERSION}" "${QUILT_VERSION}" --download-server --install-dir=./; then
              echo -e "\tERROR: Failed to install Quilt Server ${MC_VERSION}-${QUILT_VERSION} (${INSTALLER_VERSION})"
              exit 1
          fi

          echo "quilt-server-launch.jar" > ".serverjar"

          rm quilt-installer.jar
      }

      NEOFORGE_DOWNLOAD_URL="https://maven.neoforged.net/releases/net/neoforged/"

      function json_download_neoforge {
          echo "Downloading neoforge"
          
          local MC_VERSION=$MINECRAFT_VERSION
          local NEOFORGE_VERSION=$LOADER_VERSION
          
          if [[ -n ${NEOFORGE_VERSION} ]]; then
              # The 1.20.1 release lives in a different repository and is called "forge" instead of "neoforge"
              if [[ "${NEOFORGE_VERSION}" == 1.20.1-* ]]; then
                  DOWNLOAD_LINK=$NEOFORGE_DOWNLOAD_URL/forge/${NEOFORGE_VERSION}/forge-${NEOFORGE_VERSION}
                  ARTIFACT_NAME="forge"
              else
                  DOWNLOAD_LINK=$NEOFORGE_DOWNLOAD_URL/neoforge/${NEOFORGE_VERSION}/neoforge-${NEOFORGE_VERSION}
                  ARTIFACT_NAME="neoforge"
              fi
          else
              echo "No Neoforge version specified in manifest"
              exit 1
          fi
          
          echo "Downloading NeoForge version ${NEOFORGE_VERSION}"
          echo "Download link is ${DOWNLOAD_LINK}"

          # Check if the download link we generated is valid
          if [[ -n "${DOWNLOAD_LINK}" ]]; then
              if wget -q --spider "${DOWNLOAD_LINK}-installer.jar"; then
                  echo -e "Installer jar download link is valid."
              else
                  echo -e "Link is invalid. Exiting now"
                  exit 2
              fi
          else
              echo -e "No download link provided. Exiting now"
              exit 3
          fi
          
          # If so, go ahead and download the installer
          wget -O installer.jar "${DOWNLOAD_LINK}-installer.jar"
          
          if [[ ! -f ./installer.jar ]]; then
              echo "!!! Error downloading NeoForge version ${NEOFORGE_VERSION} !!!"
              exit 4
          fi
          
          # Delete args to support downgrading/upgrading
          rm -rf libraries/net/neoforged/${ARTIFACT_NAME}
          rm unix_args.txt

          # Installing server
          echo -e "Installing NeoForge server.\n"
          java -jar installer.jar --installServer || {
              echo -e "\nInstall failed using NeoForge version ${NEOFORGE_VERSION} and Minecraft version ${MINECRAFT_VERSION}."
              echo -n   "Should you be using unlimited memory value of 0, make sure to increase the default install resource limits in the Wings"
              echo      "config or specify exact allocated memory in the server Build Configuration instead of 0!"
              echo      "Otherwise, the NeoForge installer will not have enough memory.";
              exit 5;
              }

          # Symlink the startup arguments to the server directory
          ln -sf libraries/net/neoforged/${ARTIFACT_NAME}/*/unix_args.txt unix_args.txt

          # And finally clean up
          echo -e "Deleting installer.jar file.\n"
          rm -rf installer.jar
      }

      function validate_startup {
          if [[ -s "${SERVER_DIR}/unix_args.txt" ]]; then
              return 0
          fi

          local SERVER_JAR
          if [[ -f "${SERVER_DIR}/.serverjar" ]]; then
              SERVER_JAR=$(cat "${SERVER_DIR}/.serverjar")
              # The startup command expects a relative JAR path without whitespace.
              if [[ -n "${SERVER_JAR}" && "${SERVER_JAR}" != /* && "${SERVER_JAR}" != *[[:space:]]* && "/${SERVER_JAR}/" != */../* && -s "${SERVER_DIR}/${SERVER_JAR}" ]]; then
                  return 0
              fi
          fi

          echo "ERROR: No usable server startup target was found."
          echo "The server needs a nonempty unix_args.txt, or a .serverjar file"
          echo "containing the relative path to its server JAR (without spaces)."
          echo "For an uploaded ZIP, include these files or a supported manifest.json."
          exit 1
      }

      install_required

      if [[ -z "${PROJECT_ID}" ]]; then
          echo "ERROR: You must specify a PROJECT_ID environment variable!"
          exit 1
      fi

      if [[ "${PROJECT_ID}" == "zip" ]]; then
          if [[ ! -f "${SERVER_DIR}/server.zip" ]]; then
              echo -e "\tERROR: PROJECT_ID is 'zip', but ${SERVER_DIR}/server.zip was not found"
              exit 1
          fi

          unpack_zip

          if [[ -f "${SERVER_DIR}/manifest.json" ]]; then
              parse_loader_manifest "${SERVER_DIR}/manifest.json"
          else
              echo -e "\tNo manifest.json found; checking prepared server startup files"
              validate_startup
          fi
      else
          get_download
          get_loader
          unpack_zip
      fi

      if [[ -f "${SERVER_DIR}/manifest.json" ]]; then
          echo "Found manifest.json, installing mods"
          json_download_mods || exit 1
          json_download_overrides || exit 1
      fi

      if [[ -n "${LOADER_NAME:-}" ]]; then
          echo -e "\nLoader name: ${LOADER_NAME}"

          if [[ $LOADER_NAME == "forge" ]]; then
              json_download_forge
          fi

          if [[ $LOADER_NAME == "fabric" ]]; then
              json_download_fabric
          fi
          
          if [[ $LOADER_NAME == "neoforge" ]]; then
              json_download_neoforge
          fi

          if [[ $LOADER_NAME == "quilt" ]]; then
              json_download_quilt
          fi
      fi

      validate_startup
      echo -e "\nInstall completed successfully, enjoy!"
    container: 'ghcr.io/pelican-eggs/installers:java_8'
    entrypoint: bash
variables:
  -
    name: 'CurseForge API Key'
    description: |-
      A CurseForge API key is required to use this egg. This key is not visible to the server owner. You
      can get an API key here: https://console.curseforge.com
    env_variable: API_KEY
    default_value: ''
    user_viewable: false
    user_editable: false
    rules:
      - required
      - string
      - 'max:60'
    sort: 3
  -
    name: 'Modpack File ID'
    description: "The file ID belonging to a specific version of a modpack. Can either be the main file or the file ID\nassociated with the server pack.\r\n\r\nIf not provided the script will attempt to retrieve the latest server pack or client pack available."
    env_variable: VERSION_ID
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - string
    sort: 2
  -
    name: 'Modpack Project ID'
    description: "The modpack project ID from the CurseForge site on the pack page, or 'zip' if installing from an\nuploaded server.zip file.\r\n\r\nFor example, the project ID of https://www.curseforge.com/minecraft/modpacks/bofa-mods is 375152"
    env_variable: PROJECT_ID
    default_value: ''
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
    sort: 1
