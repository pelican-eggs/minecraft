scripts:
  installation:
    script: |-
      #!/bin/ash
      # shellcheck disable=SC2164 # don't error on `cd` command
      # shellcheck disable=SC2187 # don't error for `ash` vs `dash`
      # shellcheck disable=SC2223 # don't error for default variable values
      # shellcheck disable=SC3014 # don't error for `==`
      # shellcheck disable=SC3036 # don't error for echo `-e` flag
      # LeafMC API Installation Script
      #
      # Server Files: /mnt/server

      : ${PROJECT:='leaf'}
      : ${API_ENDPOINT:='api.leafmc.one'}
      : ${SERVER_JARFILE:='server.jar'}

      if [ ! -d /mnt/server ]; then
      	mkdir -p /mnt/server
      fi

      cd /mnt/server

      if [ -n "${DL_PATH}" ]; then
      	echo -e "Using supplied download url: ${DL_PATH}"
      	DOWNLOAD_URL=$(eval echo "$(echo ${DL_PATH} | sed -e 's/{{/${/g' -e 's/}}/}/g')")
      else
      	if [ "${MINECRAFT_VERSION}" = "latest" ] || [ -z "${MINECRAFT_VERSION}" ]; then
      		echo -e "Getting latest Leaf version from API..."
      		MINECRAFT_VERSION=$(curl -s "https://${API_ENDPOINT}/v2/projects/${PROJECT}" | jq -r '.versions[-1]')
      	fi

      	VER_EXISTS=$(curl -s "https://${API_ENDPOINT}/v2/projects/${PROJECT}" | jq -r --arg VERSION "${MINECRAFT_VERSION}" '.versions | index($VERSION) != null')

      	if [ "${VER_EXISTS}" = "true" ]; then
      		echo -e "Version is valid. Using version ${MINECRAFT_VERSION}"
      	else
      		echo -e "Specified version '${MINECRAFT_VERSION}' not found. Defaulting to the latest version."
      		MINECRAFT_VERSION=$(curl -s "https://${API_ENDPOINT}/v2/projects/${PROJECT}" | jq -r '.versions[-1]')
      	fi

      	if [ "${BUILD_NUMBER}" = "latest" ] || [ -z "${BUILD_NUMBER}" ]; then
      		echo -e "Getting latest build for ${MINECRAFT_VERSION}..."
      		BUILD_NUMBER=$(curl -s "https://${API_ENDPOINT}/v2/projects/${PROJECT}/versions/${MINECRAFT_VERSION}" | jq -r '.builds[-1]')
      	fi

      	BUILD_EXISTS=$(curl -s "https://${API_ENDPOINT}/v2/projects/${PROJECT}/versions/${MINECRAFT_VERSION}" | jq -r --arg BUILD "${BUILD_NUMBER}" '.builds | map(tostring) | index($BUILD) != null')

      	if [ "${BUILD_EXISTS}" = "true" ]; then
      		echo -e "Build is valid for version ${MINECRAFT_VERSION}. Using build ${BUILD_NUMBER}"
      	else
      		echo -e "Specified build '${BUILD_NUMBER}' not found for ${MINECRAFT_VERSION}. Defaulting to latest build."
      		BUILD_NUMBER=$(curl -s "https://${API_ENDPOINT}/v2/projects/${PROJECT}/versions/${MINECRAFT_VERSION}" | jq -r '.builds[-1]')
      	fi

      	echo -e "Version being downloaded"
      	echo -e "Project: ${PROJECT}"
      	echo -e "Version: ${MINECRAFT_VERSION}"
      	echo -e "Build:   ${BUILD_NUMBER}"

      	JAR_NAME=$(curl -s "https://${API_ENDPOINT}/v2/projects/${PROJECT}/versions/${MINECRAFT_VERSION}/builds/${BUILD_NUMBER}" | jq -r '.downloads.primary.name')

      	if [ -z "${JAR_NAME}" ] || [ "${JAR_NAME}" = "null" ]; then
      		echo -e "ERROR: Could not determine JAR name from API response"
      		exit 1
      	fi

      	DOWNLOAD_URL="https://${API_ENDPOINT}/v2/projects/${PROJECT}/versions/${MINECRAFT_VERSION}/builds/${BUILD_NUMBER}/downloads/${JAR_NAME}"
      fi

      echo -e "Running: curl -o ${SERVER_JARFILE} ${DOWNLOAD_URL}"

      if [ -f "${SERVER_JARFILE}" ]; then
      	mv "${SERVER_JARFILE}" "${SERVER_JARFILE}.old"
      fi

      curl -o "${SERVER_JARFILE}" "${DOWNLOAD_URL}"

      if [ ! -f server.properties ]; then
      	echo -e "Downloading default MC server.properties"
      	curl -o server.properties https://raw.githubusercontent.com/pelican-eggs/minecraft/refs/heads/main/java/server.properties
      fi
    container: 'ghcr.io/pelican-eggs/installers:alpine'
    entrypoint: ash
variables:
