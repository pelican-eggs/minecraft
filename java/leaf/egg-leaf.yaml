    name: 'Build Number'
    description: |-
      The build number for the Leaf release.

      Leave at latest to always get the latest version. Invalid versions will default to latest.
    env_variable: BUILD_NUMBER
    default_value: latest
    user_viewable: true
    user_editable: true
    rules:
