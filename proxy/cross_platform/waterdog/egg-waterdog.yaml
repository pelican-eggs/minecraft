scripts:
  installation:
    script: |-
      #!/bin/bash

      if [ ! -d /mnt/server ]; then
          mkdir /mnt/server
      fi

      cd /mnt/server

      # Adding '.jar' if it isn't part of the file name
      if [[ "${SERVER_JARFILE}" == "*\.jar" ]]; then
          echo -e "adding.jar to server file name"
          SERVER_JARFILE="${SERVER_JARFILE}.jar"
      fi

      if [ -z "${WATERDOG_VERSION}" ] || [ "${WATERDOG_VERSION}" == "latest" ]; then
          echo -e "downloading latest waterdog build\n"
          curl -sSL -o ${SERVER_JARFILE} https://jenkins.waterdog.dev/job/Waterdog/job/Waterdog/job/master-zlib/lastSuccessfulBuild/artifact/Waterfall-Proxy/bootstrap/target/Waterdog.jar
      else 
          echo -e "downloading waterdog build ${WATERDOG_VERSION}\n"
          curl -sSL -o ${SERVER_JARFILE} https://jenkins.waterdog.dev/job/Waterdog/job/Waterdog/job/master-zlib/${WATERDOG_VERSION}/artifact/Waterfall-Proxy/bootstrap/target/Waterdog.jar
      fi

      if [ ! -f config.yml ]; then
          echo -e "Downloading waterfall config.yml"
         curl -o config.yml https://raw.githubusercontent.com/pelican-eggs/minecraft/main/proxy/java/waterfall/config.yml
      else
          echo -e "Waterfall config.yml exists. Will not pull a new file"
      fi

      ## install end
      echo "-----------------------------------------"
      echo "Installation completed..."
      echo "-----------------------------------------"
    container: 'ghcr.io/pelican-eggs/installers:debian'
    entrypoint: bash
